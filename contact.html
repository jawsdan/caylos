<!doctype html>
<html lang="nb">
<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width, initial-scale=1">
  <title>Caylò's Fried Chicken</title>
  <meta name="description" content="Caylò's Fried Chicken – sprø, saftig kylling stekt fersk hver dag.">
  <meta name="theme-color" content="#b8202b">
  <link rel="icon" href="assets/img/favicon.png" type="image/png">
  <link rel="apple-touch-icon" href="assets/img/favicon.png">
  <link rel="preconnect" href="https://fonts.googleapis.com">
  <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
  <link href="https://fonts.googleapis.com/css2?family=Kanit:wght@500;700;800;900&family=DM+Sans:wght@400;500;600;700&display=swap" rel="stylesheet">
  <link rel="stylesheet" href="assets/css/style.css?v=4">
</head>
<body data-page="contact" data-title="contact.title">
  <header id="site-header" class="site-header"></header>
  <main>
    <section class="page-hero">
      <div class="container">
        <span class="eyebrow" data-i18n="contact.eyebrow"></span>
        <h1 data-i18n="contact.title"></h1>
        <p data-i18n="contact.text"></p>
      </div>
    </section>

    <section class="section">
      <div class="container split" style="align-items:start">
        <div>
          <h2 data-i18n="contact.info.title"></h2>
          <ul class="contact-list" style="margin-top:24px">
            <li><div class="feature-icon">✉️</div><div><strong data-i18n="contact.email"></strong><span data-company="email"></span></div></li>
            <li><div class="feature-icon">📞</div><div><strong data-i18n="contact.phone"></strong><span data-company="phone"></span></div></li>
            <li><div class="feature-icon">🏢</div><div><strong data-i18n="contact.address"></strong><span data-company="address"></span></div></li>
          </ul>
          <div class="faq" style="margin-top:40px">
            <h3 data-i18n="contact.faq.title"></h3>
            <details><summary data-i18n="contact.faq.1.q"></summary><p data-i18n="contact.faq.1.a"></p></details>
            <details><summary data-i18n="contact.faq.2.q"></summary><p data-i18n="contact.faq.2.a"></p></details>
            <details><summary data-i18n="contact.faq.3.q"></summary><p data-i18n="contact.faq.3.a"></p></details>
          </div>
        </div>
        <section class="card">
          <h2 data-i18n="contact.form.title"></h2>
          <form class="form" data-mailto="email" novalidate>
            <div class="form-row">
              <div><label for="contact-name" data-i18n="form.name"></label><input class="input" id="contact-name" name="name" required autocomplete="name"></div>
              <div><label for="contact-email" data-i18n="form.email"></label><input class="input" id="contact-email" name="email" type="email" required autocomplete="email"></div>
            </div>
            <div>
              <label for="contact-subject" data-i18n="contact.form.subject"></label>
              <select class="select input" id="contact-subject" name="subject">
                <option data-i18n="contact.form.subject.general"></option>
                <option data-i18n="contact.form.subject.feedback"></option>
                <option data-i18n="contact.form.subject.order"></option>
                <option data-i18n="contact.form.subject.press"></option>
              </select>
            </div>
            <div><label for="contact-message" data-i18n="form.message"></label><textarea class="input" id="contact-message" name="message" required></textarea></div>
            <div><button class="btn btn-primary" type="submit" data-i18n="form.send"></button></div>
            <p class="form-note" data-i18n="form.note"></p>
            <div class="form-success" role="status" data-i18n="form.success"></div>
          </form>
        </section>
      </div>
    </section>
  </main>
  <footer id="site-footer" class="site-footer"></footer>
  <script src="assets/js/data.js?v=4"></script>
  <script src="assets/js/i18n.js?v=4"></script>
  <script src="assets/js/main.js?v=4"></script>
</body>
</html>
