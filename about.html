<!doctype html>
<html lang="nb">
<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width, initial-scale=1">
  <title>Caylò's Fried Chicken</title>
  <meta name="description" content="Caylò's Fried Chicken – sprø, saftig kylling stekt fersk hver dag.">
  <meta name="theme-color" content="#b8202b">
  <link rel="icon" href="assets/img/favicon.png" type="image/png">
  <link rel="apple-touch-icon" href="assets/img/favicon.png">
  <link rel="preconnect" href="https://fonts.googleapis.com">
  <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
  <link href="https://fonts.googleapis.com/css2?family=Kanit:wght@500;700;800;900&family=DM+Sans:wght@400;500;600;700&display=swap" rel="stylesheet">
  <link rel="stylesheet" href="assets/css/style.css">
</head>
<body data-page="about" data-title="about.title">
  <header id="site-header" class="site-header"></header>
  <main>
    <section class="page-hero">
      <div class="container">
        <span class="eyebrow" data-i18n="about.eyebrow"></span>
        <h1 data-i18n="about.title"></h1>
        <p data-i18n="about.text"></p>
      </div>
    </section>

    <section class="section">
      <div class="container split">
        <div>
          <h2 data-i18n="about.story.title"></h2>
          <p data-i18n="about.story.p1"></p>
          <p data-i18n="about.story.p2"></p>
        </div>
        <div class="art-box" aria-hidden="true"><div class="logo-disc"><img src="assets/img/logo.png" alt=""></div></div>
      </div>
    </section>
    <section class="section-tight">
      <div class="container stats">
        <div class="stat"><strong id="stat-restos"></strong><span data-i18n="about.stat.restos"></span></div>
        <div class="stat"><strong id="stat-cities"></strong><span data-i18n="about.stat.cities"></span></div>
        <div class="stat"><strong id="stat-items"></strong><span data-i18n="about.stat.items"></span></div>
      </div>
    </section>
    <section class="section">
      <div class="container">
        <h2 class="center" style="margin-bottom:32px" data-i18n="about.values.title"></h2>
        <div class="grid grid-3">
          <div class="card"><div class="feature-icon">⭐</div><h3 data-i18n="about.values.1.title"></h3><p class="muted" data-i18n="about.values.1.text"></p></div>
          <div class="card"><div class="feature-icon">🤝</div><h3 data-i18n="about.values.2.title"></h3><p class="muted" data-i18n="about.values.2.text"></p></div>
          <div class="card"><div class="feature-icon">🏘️</div><h3 data-i18n="about.values.3.title"></h3><p class="muted" data-i18n="about.values.3.text"></p></div>
        </div>
      </div>
    </section>
  </main>
  <footer id="site-footer" class="site-footer"></footer>
  <script src="assets/js/data.js"></script>
  <script src="assets/js/i18n.js"></script>
  <script src="assets/js/main.js"></script>
</body>
</html>
