<!doctype html>
<html lang="nb">
<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width, initial-scale=1">
  <title>Caylos' Fried Chicken</title>
  <meta name="description" content="Caylos' Fried Chicken – sprø, saftig kylling stekt fersk hver dag.">
  <meta name="theme-color" content="#b3261e">
  <link rel="icon" href="assets/favicon.svg" type="image/svg+xml">
  <link rel="preconnect" href="https://fonts.googleapis.com">
  <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
  <link href="https://fonts.googleapis.com/css2?family=Bricolage+Grotesque:opsz,wght@12..96,700;12..96,800&family=DM+Sans:wght@400;500;600;700&display=swap" rel="stylesheet">
  <link rel="stylesheet" href="assets/css/style.css">
</head>
<body data-page="home" data-title="home.title">
  <header id="site-header" class="site-header"></header>
  <main>
    <section class="hero">
      <div class="container hero-inner">
        <div>
          <span class="eyebrow" style="color:var(--gold)" data-i18n="home.hero.eyebrow"></span>
          <h1 data-i18n-html="home.hero.title"></h1>
          <p data-i18n="home.hero.text"></p>
          <div class="hero-actions">
            <a class="btn btn-gold" href="menu.html" data-i18n="home.hero.menu"></a>
            <a class="btn btn-light" href="restaurants.html" data-i18n="home.hero.find"></a>
          </div>
        </div>
        <div class="hero-art" aria-hidden="true">
          <svg viewBox="0 0 400 400">
            <circle cx="200" cy="200" r="180" fill="#8a1c16"/>
            <circle cx="200" cy="200" r="150" fill="#fff8ec"/>
            <circle cx="200" cy="200" r="132" fill="none" stroke="#eadfcd" stroke-width="4"/>
            <g transform="translate(200 200)">
              <g transform="rotate(-35) translate(-10 -40)">
                <ellipse cx="0" cy="-20" rx="48" ry="58" fill="#e09a1b"/>
                <ellipse cx="-10" cy="-32" rx="34" ry="40" fill="#f4b324"/>
                <path d="M-20 -50 q10 -8 20 0 M-30 -20 q10 -8 20 0 M5 -30 q10 -8 20 0" stroke="#c97f12" stroke-width="5" fill="none" stroke-linecap="round"/>
                <rect x="-9" y="30" width="18" height="52" rx="6" fill="#fff"/>
                <circle cx="-12" cy="88" r="13" fill="#fff"/>
                <circle cx="12" cy="88" r="13" fill="#fff"/>
              </g>
              <g transform="rotate(40) translate(30 -20)">
                <ellipse cx="0" cy="-20" rx="42" ry="52" fill="#e09a1b"/>
                <ellipse cx="-8" cy="-30" rx="30" ry="36" fill="#f4b324"/>
                <path d="M-18 -45 q9 -7 18 0 M2 -20 q9 -7 18 0" stroke="#c97f12" stroke-width="5" fill="none" stroke-linecap="round"/>
                <rect x="-8" y="26" width="16" height="46" rx="6" fill="#fff"/>
                <circle cx="-11" cy="78" r="12" fill="#fff"/>
                <circle cx="11" cy="78" r="12" fill="#fff"/>
              </g>
            </g>
          </svg>
          <div class="hero-badge" data-i18n="home.hero.badge"></div>
        </div>
      </div>
    </section>

    <div class="ticker" aria-hidden="true"><div class="ticker-track" id="ticker"></div></div>

    <section class="section">
      <div class="container">
        <div class="menu-cat-head" style="justify-content:space-between">
          <div>
            <span class="eyebrow" data-i18n="home.featured.eyebrow"></span>
            <h2 data-i18n="home.featured.title"></h2>
          </div>
          <a class="btn btn-outline" href="menu.html" data-i18n="home.featured.all"></a>
        </div>
        <div class="grid grid-3" id="featured"></div>
      </div>
    </section>

    <section class="section" style="background:var(--paper)">
      <div class="container">
        <div class="center" style="margin-bottom:36px">
          <span class="eyebrow" data-i18n="home.why.eyebrow"></span>
          <h2 data-i18n="home.why.title"></h2>
        </div>
        <div class="grid grid-3">
          <div class="card"><div class="feature-icon">🐔</div><h3 data-i18n="home.why.1.title"></h3><p class="muted" data-i18n="home.why.1.text"></p></div>
          <div class="card"><div class="feature-icon">🌶️</div><h3 data-i18n="home.why.2.title"></h3><p class="muted" data-i18n="home.why.2.text"></p></div>
          <div class="card"><div class="feature-icon">❤️</div><h3 data-i18n="home.why.3.title"></h3><p class="muted" data-i18n="home.why.3.text"></p></div>
        </div>
      </div>
    </section>

    <section class="section">
      <div class="container split">
        <div>
          <span class="eyebrow" data-i18n="home.restos.eyebrow"></span>
          <h2 data-i18n="home.restos.title"></h2>
          <p class="muted" data-i18n="home.restos.text"></p>
          <div class="stats" style="margin:24px 0">
            <div class="stat"><strong id="stat-restos"></strong><span data-i18n="home.restos.count"></span></div>
            <div class="stat"><strong id="stat-cities"></strong><span data-i18n="home.restos.cities"></span></div>
          </div>
          <a class="btn btn-primary" href="restaurants.html" data-i18n="home.restos.btn"></a>
        </div>
        <div class="art-box red" aria-hidden="true">📍</div>
      </div>
    </section>

    <section class="section-tight">
      <div class="container grid grid-2">
        <div class="band">
          <div><h2 data-i18n="home.jobs.title"></h2><p data-i18n="home.jobs.text"></p></div>
          <a class="btn btn-gold" href="jobs.html" data-i18n="home.jobs.btn"></a>
        </div>
        <div class="band gold">
          <div><h2 data-i18n="home.franchise.title"></h2><p data-i18n="home.franchise.text"></p></div>
          <a class="btn btn-primary" href="franchise.html" data-i18n="home.franchise.btn"></a>
        </div>
      </div>
    </section>
  </main>
  <footer id="site-footer" class="site-footer"></footer>
  <script src="assets/js/data.js"></script>
  <script src="assets/js/i18n.js"></script>
  <script src="assets/js/main.js"></script>
</body>
</html>
