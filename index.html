<!doctype html>
<html lang="nb">
<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width, initial-scale=1">
  <title>Caylò's Fried Chicken</title>
  <meta name="description" content="Caylò's Fried Chicken – sprø, saftig kylling stekt fersk hver dag.">
  <meta name="theme-color" content="#b8202b">
  <link rel="icon" href="assets/img/favicon.png" type="image/png">
  <link rel="apple-touch-icon" href="assets/img/favicon.png">
  <link rel="preconnect" href="https://fonts.googleapis.com">
  <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
  <link href="https://fonts.googleapis.com/css2?family=Kanit:wght@500;700;800;900&family=DM+Sans:wght@400;500;600;700&display=swap" rel="stylesheet">
  <link rel="stylesheet" href="assets/css/style.css?v=12">
</head>
<body data-page="home" data-title="home.title">
  <header id="site-header" class="site-header"></header>
  <main>
    <section class="hero">
      <div class="container hero-inner">
        <div>
          <span class="eyebrow" data-i18n="home.hero.eyebrow"></span>
          <h1 data-i18n-html="home.hero.title"></h1>
          <p data-i18n="home.hero.text"></p>
          <div class="hero-actions">
            <a class="btn btn-gold" href="restaurants.html" data-order-link target="_blank" rel="noopener" data-i18n="home.hero.order"></a>
            <a class="btn btn-light" href="menu.html" data-i18n="home.hero.menu"></a>
          </div>
        </div>
        <div class="hero-disc"><img src="assets/img/logo.png" alt="Caylò's Original Fried Chicken"></div>
      </div>
    </section>

    <section class="section">
      <div class="container">
        <div class="menu-cat-head" style="justify-content:space-between">
          <div>
            <span class="eyebrow" data-i18n="home.featured.eyebrow"></span>
            <h2 data-i18n="home.featured.title"></h2>
          </div>
          <a class="btn btn-outline" href="menu.html" data-i18n="home.featured.all"></a>
        </div>
        <div class="grid grid-3" id="featured"></div>
      </div>
    </section>

    <section class="section" style="background:var(--paper)">
      <div class="container">
        <div class="center" style="margin-bottom:36px">
          <span class="eyebrow" data-i18n="home.why.eyebrow"></span>
          <h2 data-i18n="home.why.title"></h2>
        </div>
        <div class="grid grid-3">
          <div class="card"><div class="feature-icon">🐔</div><h3 data-i18n="home.why.1.title"></h3><p class="muted" data-i18n="home.why.1.text"></p></div>
          <div class="card"><div class="feature-icon">🌶️</div><h3 data-i18n="home.why.2.title"></h3><p class="muted" data-i18n="home.why.2.text"></p></div>
          <div class="card"><div class="feature-icon">❤️</div><h3 data-i18n="home.why.3.title"></h3><p class="muted" data-i18n="home.why.3.text"></p></div>
        </div>
      </div>
    </section>

    <section class="section">
      <div class="container split">
        <div>
          <span class="eyebrow" data-i18n="home.restos.eyebrow"></span>
          <h2 data-i18n="home.restos.title"></h2>
          <p class="muted" data-i18n="home.restos.text"></p>
          <div class="stats" style="margin:24px 0">
            <div class="stat"><strong id="stat-restos"></strong><span data-i18n="home.restos.count"></span></div>
            <div class="stat"><strong id="stat-cities"></strong><span data-i18n="home.restos.cities"></span></div>
          </div>
          <a class="btn btn-primary" href="restaurants.html" data-i18n="home.restos.btn"></a>
        </div>
        <div class="art-box red" aria-hidden="true">📍</div>
      </div>
    </section>

    <section class="section-tight">
      <div class="container grid grid-2">
        <div class="band">
          <div><h2 data-i18n="home.jobs.title"></h2><p data-i18n="home.jobs.text"></p></div>
          <a class="btn btn-gold" href="jobs.html" data-i18n="home.jobs.btn"></a>
        </div>
        <div class="band gold">
          <div><h2 data-i18n="home.franchise.title"></h2><p data-i18n="home.franchise.text"></p></div>
          <a class="btn btn-primary" href="franchise.html" data-i18n="home.franchise.btn"></a>
        </div>
      </div>
    </section>
  </main>
  <footer id="site-footer" class="site-footer"></footer>
  <script src="assets/js/data.js?v=12"></script>
  <script src="assets/js/i18n.js?v=12"></script>
  <script src="assets/js/main.js?v=12"></script>
</body>
</html>
